name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    # Throwaway PostgreSQL for the integration suites (they create and clean
    # up their own data, exactly like local development).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: classpulse_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/classpulse_ci
      # CI-only secret; production uses a real random value from the server .env
      JWT_SECRET: ci-only-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: cd backend && npm ci

      - name: Bootstrap schema, seed data, and test fixtures
        run: |
          cd backend
          # Apply schema.sql + all migrations ONCE, sequentially — Jest workers
          # each import the app, and running migrations concurrently in every
          # worker on a fresh database causes DDL lock contention.
          node -e "const {runMigrations}=require('./src/db/migrate'); const {pool}=require('./src/config/db'); runMigrations(pool).then(()=>pool.end()).catch(e=>{console.error('Migration error:', e.message); process.exit(1)})"
          node src/db/seed.js
          node scripts/ci-fixtures.js

      - name: Run test suite
        run: cd backend && npm test

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build
        run: cd frontend && npm run build
